---

bundles:
  - name: realm
    dir: schema/realm

generate:
  - name: base
    inputs:
      - local: realm
    output: .

    opts:
      paths: import
      module: github.com/pentops/realms
    plugins:
      - base: go
      - base: go-grpc
      - base: go-j5
      - base: go-o5-messaging

managedPaths:
  - gen

plugins:
  - name: go
    type: PLUGIN_PROTO
    docker:
      image: ghcr.io/pentops/protoc-gen-go:v1.34.2

  - name: go-grpc
    type: PLUGIN_PROTO
    docker:
      image: ghcr.io/pentops/protoc-gen-go-grpc:v1.4.0

  - name: go-o5-messaging
    base: go
    docker:
      image: ghcr.io/pentops/protoc-gen-go-o5-messaging:7e07c29129f03edc9ef01ba4739328625ef24746

  - name: go-j5
    base: go
    docker:
      image: ghcr.io/pentops/protoc-gen-go-j5:c98cd3e324e8c40297fc5629c3fdc2225505eb00
